const KEY='leoGardenV5',DAY=86400000,$=id=>document.getElementById(id);let page='home',recognition=null,voiceNotice='';
function fresh(){return{version:5,stars:0,words:{},awards:{},session:null,settings:{rate:.75,voice:''}}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s?.version===5&&s.words&&s.awards)return s;let n=fresh(),old=JSON.parse(localStorage.getItem('leoWordGameV4'));if(old){n.stars=Math.max(0,Number(old.stars)||0);n.legacy=old}return n}catch{return fresh()}}
let S=load();S.settings??={rate:.75,voice:''};function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{$('notice').innerHTML='<p class="notice">This browser cannot save progress. Ask a grown-up to allow website storage, or download a backup.</p>'}stats()}
function stats(){$('stars').textContent='★ '+S.stars+' stars'}function rec(w){return S.words[w]??=( {level:0,clean:[],meaning:0,read:0,due:0,last:0,events:[]})}function stage(r){return['Learning','Supported','Independent','Strong'][r.level]}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,f,c=''){return `<button class="${c}" onclick="${esc(f)}">${t}</button>`}
function stop(){if(recognition){recognition.abort();recognition=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voices(){return 'speechSynthesis'in window?speechSynthesis.getVoices():[]}
function say(text){if(!('speechSynthesis'in window)){voiceNotice='Sound is unavailable. A grown-up can read aloud.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=+S.settings.rate||.75;u.voice=voices().find(v=>v.name===S.settings.voice)||voices().find(v=>v.lang==='en-GB')||null;u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled")return;voiceNotice='Sound could not play. Ask a grown-up to read aloud.'};speechSynthesis.speak(u)}
function home(){stop();page='home';let due=DATA.filter(d=>rec(d.w).last&&rec(d.w).due<=Date.now()).length;$('app').innerHTML=`<section class="hero"><div><span class="eyebrow">A little adventure, just for you</span><h1>Let's grow<br>some words, Leo.</h1><p>Listen, discover and spell.<br>Three words. Nine little steps. Lots to be proud of.</p>${btn(S.session?'Continue my adventure ':'Start my adventure ',S.session?'resume()':'start()','primary')}<p class="small">About 5–8 minutes · Stop whenever you like<br>${due?due+' words ready for a gentle revisit.':'A little practice is enough for today.'}</p></div><div class="garden"><div>☀️</div><div class="lion">🦁</div><b>Leo's growing garden</b><div class="flowers">✿ 🌱 🌼 ✿</div></div></section><section class="cards"><article class="card"><span class="icon">🌿</span><h2>My adventure</h2><p>Words chosen for you, with just the help you need.</p>${btn('Let’s go ',S.session?'resume()':'start()','primary')}</article><article class="card"><span class="icon">🔎</span><h2>Explore a patch</h2><p>Sounds, tricky words and useful word endings.</p>${btn('Choose a patch','explore()')}</article><article class="card"><span class="icon">🏅</span><h2>My treasures</h2><p>Every little effort helps your garden grow.</p>${btn('See my rewards','rewards()')}</article></section>`;stats()}
function explore(){stop();page='explore';$('app').innerHTML=`<section class="game">${btn(' Back','home()')}<h1>Pick a patch.</h1><div class="cards">${[...new Set(DATA.map(d=>d.g))].map(g=>`<article class="card"><h2>🌱 ${g}</h2><p>${DATA.filter(d=>d.g===g).length} words to discover</p>${btn('Explore ',`start('${g}')`,'primary')}</article>`).join('')}</div>${S.session?'<p class="small">Your paused adventure will continue first.</p>':''}</section>`}
function selectWords(g){let now=Date.now();return DATA.filter(d=>!g||d.g===g).map((d,i)=>({d,i,r:rec(d.w)})).sort((a,b)=>{let score=x=>x.r.last?(x.r.due<=now?0:2):1;return score(a)-score(b)||(a.r.due||0)-(b.r.due||0)||a.i-b.i}).slice(0,3).map(x=>x.d)}
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(g){if(S.session){resume();return}let tasks=[];selectWords(g).forEach(d=>{let level=rec(d.w).level;(level>=2?['spell','read','learn']:['learn','read','spell']).forEach(kind=>tasks.push({w:d.w,kind,level,answer:'',done:false,help:false,wrong:false,taps:0,said:false,heard:false,order:shuffled([0,1,2])}))});S.session={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),i:0,tasks,earned:0};save();resume()}
function resume(){page='game';render()}function current(){return S.session?.tasks[S.session.i]}
function render(){if(page!=='game')return;let q=current();if(!q){finish();return}let d=DATA.find(d=>d.w===q.w),ss=S.session,body='';

else if(q.kind==='read')body=`<span class="eyebrow">Read · understand</span><h2>What does it mean?</h2><div class="sentence">${d.s}</div>${btn('🔊 Read with me','readAloud()')}<p>Here, what does <b>${d.w}</b> mean?</p><div class="choices">${q.order.map(k=>btn(d.opts[k],`choose(${k})`,'choice')).join('')}</div><p class="small">${q.readHelp?'Reading together is supported practice.':'Read the sentence yourself, or choose to read together.'}</p>`;
else{let keys=q.level===0?[...new Set(d.w.toLowerCase())].sort().join(''):q.level===1?[...new Set(d.w.toLowerCase()+'aertsin')].sort().join(''):'qwertyuiop|asdfghjkl|zxcvbnm';body=`<span class="eyebrow">${q.level===0?'Build with letters':q.level===1?'Spell with extra letters':'Spell on your own'}</span><h2>Finish the sentence.</h2><div class="sentence">${esc(d.s).replace(new RegExp('\\b'+d.w+'\\b','i'),`<span class="entry" role="status" aria-label="Your spelling">${esc(q.answer)||'____'}</span>`)}</div>${btn('🔊 Whole sentence','hearSentence()')}${btn('🔊 Target word','hearWord()')}<p class="small">${q.level<2?'Letter tiles can be used more than once.':'Your letter keyboard. No word suggestions.'}</p>${q.hintOpen?`<div class="hint"><b>Look & learn</b><div class="word">${d.w}</div><p>${d.h}</p>${btn('🔊 Listen','hearWord()')}${btn('I’m ready — hide it','hideHint()','primary')}</div>`:`<div aria-label="Leo’s letter keyboard">${keys.split('|').map(row=>`<div class="keys">${[...row].map(c=>btn(c,`letter('${c}')`)).join('')}</div>`).join('')}</div><p>${btn('⌫ Delete','erase()')}${btn('Check my word ✓','check()','primary')}</p>${btn('💡 Help me','help()')}${btn('A grown-up will read it','adultRead()')}`}`}

function refresh(){save();render()}function hearLearn(){current().heard=true;save();render();say(current().w)}function adultLearn(){current().heard=true;refresh()}function saidIt(){current().said=true;refresh()}function tapLetter(i){let q=current();if(!q.done&&i===q.taps)q.taps++;refresh()}function completeLearn(){let q=current();if(q.done)return;if(!q.heard||!q.said||q.taps<q.w.length){q.message='Listen, say it, then tap all the letters in order.';refresh();return}complete()}

function letter(c){let q=current();if(q.done||q.hintOpen)return;if(q.answer.length<24)q.answer+=c;q.message='';refresh()}function erase(){let q=current();if(!q.done)q.answer=q.answer.slice(0,-1);refresh()}function hearSentence(){say(DATA.find(d=>d.w===current().w).s)}function hearWord(){say(current().w)}function adultRead(){let q=current();if(q.done)return;q.help=true;q.message='Grown-up: read the sentence and target word aloud without showing the spelling.';refresh()}function help(){let q=current();if(q.done)return;q.help=true;q.hintOpen=true;q.answer='';refresh()}function hideHint(){current().hintOpen=false;current().answer='';refresh()}function check(){let q=current();if(q.done||q.hintOpen||!q.answer)return;if(q.answer===q.w.toLowerCase())complete();else{q.wrong=true;q.message='Good thinking, Leo. Listen again, or try “Help me”.';refresh()}}
function evidence(q,now=Date.now()){let r=rec(q.w),independent=q.kind==='spell'&&q.level>=2&&!q.help&&!q.wrong;r.events.push({at:now,kind:q.kind,independent,help:!!q.help,wrong:!!q.wrong,readHelp:!!q.readHelp,level:q.level});r.events=r.events.slice(-60);if(q.kind==='learn'&&r.level===0)r.level=1;if(q.kind==='read'&&!q.wrong&&!q.readHelp){r.meaning++;r.read++}if(q.kind==='spell'){if(q.level===1&&!q.help&&!q.wrong)r.level=Math.max(2,r.level);if(independent){let last=r.clean.at(-1);if(!last||now-last>=DAY)r.clean.push(now);if(r.clean.length>=3&&now-r.clean[0]>=7*DAY&&r.meaning>0&&r.read>0)r.level=3;r.due=now+[DAY,3*DAY,7*DAY,14*DAY][Math.min(3,r.clean.length-1)]}else{r.due=now+DAY;if(q.wrong||q.help){r.clean=[];if(r.level===3)r.level=2}}}r.last=now;if(!r.due)r.due=now+DAY}

function outfitOK(o){return o.world?worldClears(o.world)===3:S.stars>=o.stars}
function avatar(){let o=OUTFITS.find(o=>o.id===expansionState().outfit);return !o||!outfitOK(o)||o.id==='lion'?'🦁':'🦁 '+o.icon}
function viewTop(){window.scrollTo?.(0,0)}
function openWorlds(){stop();viewTop();page='worlds';expansionState();$('app').innerHTML=`<section class="game">${btn('Back','home()')}<span class="eyebrow">New adventures · six little tasks</span><h1>Beyond the garden.</h1><p>Ready for a little more, Leo? Pick a place to explore. Every level has help.</p>${S.quest?`<div class="notice">You have a little journey waiting. ${btn('Continue my journey','questResume()','primary')}${btn('Save it for later','parkQuest()')}</div>`:''}<div class="worlds">${WORLDS.map(w=>`<article class="card" style="background:${w.colour}"><span class="icon">${w.icon}</span><h2>${w.name}</h2><p>${w.desc}</p><span class="chip">${worldClears(w.id)} / 3 stamps</span>${btn('Visit '+w.name,`worldPage('${w.id}')`,'primary')}</article>`).join('')}</div><p class="small">Your original garden adventure is still available. New stamps celebrate finishing, with or without help.</p></section>`}
function parkQuest(){if(!S.quest)return;let e=expansionState();e.parked??={};e.parked[S.quest.world+"-"+S.quest.mission]=S.quest;S.quest=null;save();openWorlds()}
function worldPage(id){stop();viewTop();page='world';const w=WORLDS.find(w=>w.id===id);if(!w)return;let e=expansionState();$('app').innerHTML=`<section class="game">${btn('Back to the map','openWorlds()')}<div class="worldBanner" style="background:${w.colour}"><span class="icon">${w.icon}</span><h1>${w.name}</h1><p>${w.desc}</p><b>${w.reward} Finish all three levels for ${w.prize}.</b></div>${id==='sounds'?`<div class="card"><b>Choose your climb</b><p>${btn((e.mode==='gentle'?'✓ ':'')+'Gentle climb',"setClimb('gentle')",e.mode==='gentle'?'gold':'')}${btn((e.mode==='brave'?'✓ ':'')+'Brave climb',"setClimb('brave')",e.mode==='brave'?'gold':'')}</p><p class="small">Gentle: learn, hide, then spell with extra letters. Brave: start with the full keyboard; Help me is always here.</p></div>`:''}<div class="missions">${w.missions.map((name,n)=>{let key=id+'-'+n,cleared=e.cleared[key],open=n===0||e.cleared[id+'-'+(n-1)];return `<article class="card row"><div><span class="eyebrow">Level ${n+1}</span><h2>${cleared?'✅ ':''}${name}</h2><p class="small">${cleared?'Stamp collected · practise again whenever you like':open?'Six little tasks · about 4–6 minutes':'Finish the previous level to open this path.'}</p></div>${open?btn(cleared?'Practise again':'Begin level',`startQuest('${id}',${n})`,'primary'):'<span aria-label="Locked">🔒</span>'}</article>`}).join('')}</div>${S.quest?btn('Continue my paused journey','questResume()'):''}</section>`}
function setClimb(mode){expansionState().mode=mode;save();worldPage('sounds')}

function startQuest(world,n){let e=expansionState();if(n<0||!Number.isInteger(n)||!WORLDS.some(w=>w.id===world&&n<w.missions.length)||(n>=3&&!foundationUnlocked(world,n))||(n>0&&!e.cleared[world+'-'+(n-1)]))return;if(S.quest){questResume();return}let parked=e.parked?.[world+"-"+n];if(parked){S.quest=parked;delete e.parked[world+"-"+n];save();questResume();return}let tasks=[];
 if(world==='story')tasks=STORIES[n].qs.map(([prompt,correct,a,b,h])=>({kind:'story',prompt,opts:[correct,a,b],hint:h}));
 if(world==='workshop')tasks=BUILDS[n].map(([w,root,ending,s,h])=>({kind:'build',w,root,ending,s,hint:h}));
 if(world==='sounds')tasks=CLIMBS[n].map(w=>({kind:'climb',w,level:e.mode==='brave'?2:1,help:e.mode!=='brave',study:e.mode!=='brave'}));
 tasks.forEach(t=>Object.assign(t,{answer:'',done:false,wrong:false,help:t.kind==='build'||!!t.help,order:shuffled([0,1,2])}));S.quest={id:'journey-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),world,mission:n,i:0,tasks,earned:0};save();questResume()}
function questResume(){viewTop();if(!S.quest){openWorlds();return}page='quest';questRender()}
function questCurrent(){return S.quest?.tasks[S.quest.i]}
function questKeyboard(q){let keys=q.kind==='climb'&&q.level<2?[...new Set(q.w+'aertsn')].sort().join('').match(/.{1,8}/g).join('|'):'qwertyuiop|asdfghjkl|zxcvbnm';return `<div class="questKeys" aria-label="Leo’s letter keyboard">${keys.split('|').map(row=>`<div class="keys">${[...row].map(c=>btn(c,`questLetter('${c}')`)).join('')}</div>`).join('')}</div><p>${btn('⌫ Delete','questErase()')}${btn('Check my word','questCheck()','primary')}</p>`}
function questRender(){if(page!=='quest')return;let s=S.quest,q=questCurrent();if(!q){questFinish();return}let w=WORLDS.find(w=>w.id===s.world),d=DATA.find(d=>d.w===q.w),body='';
 if(q.kind==='story'){body=`<span class="eyebrow">Read · think · discover</span><h2>${w.missions[s.mission]}</h2><div class="storyText">${STORIES[s.mission].text}</div>${btn('Read with me','questRead()')}<p class="small">You may look back at the story. Good readers use clues.</p><h2>${q.prompt}</h2><div class="choices">${q.order.map(k=>btn(q.opts[k],`questChoose(${k})`,'choice')).join('')}</div>${q.hintOpen?`<div class="hint">${q.hint}</div>`:btn('Help me find a clue','questHint()')}`;}
 else if(q.kind==='build'){body=`<span class="eyebrow">Word inventor · supported word building</span><h2>Make the word fit.</h2><div class="formula"><span>${q.root}</span><b>${q.ending==='un'?'put un at the front':'add '+q.ending}</b></div><div class="sentence">${q.s.replace('___',`<span class="entry" role="status">${esc(q.answer)||'____'}</span>`)}</div>${btn('Hear the sentence','questRead()')}${q.hintOpen?`<div class="hint"><p>${q.hint}</p><div class="word">${q.w}</div>${btn('Hide and build it','questHide()','primary')}</div>`:questKeyboard(q)+btn('Help me','questHint()')}<p class="small">Use the root word and the clue. This is practice at building words.</p>`;}
 else{body=`<span class="eyebrow">${q.level<2?'Gentle climb · supported spelling':'Brave climb · full keyboard'}</span><h2>${q.study?'Meet a mountain word.':'Finish the sentence.'}</h2>${q.study||q.hintOpen?`<div class="hint"><div class="word">${q.w}</div><p>${d.m}.</p><p>${d.h}</p>${btn('Listen to the word','questWord()')}${btn('Hide it — I’m ready','questHide()','primary')}</div>`:`<div class="sentence">${d.s.replace(new RegExp('\\b'+q.w+'\\b','i'),`<span class="entry" role="status">${esc(q.answer)||'____'}</span>`)}</div>${btn('Hear the sentence','questRead()')}${btn('Hear the word','questWord()')}${questKeyboard(q)}${btn('Help me','questHint()')}${btn('A grown-up will read it','questAdult()')}`}`;}
 $('app').innerHTML=`<section class="game"><div class="row">${btn(q?S.quest.i?'Previous':'Back to the map':'Back','questBack()')}<span class="small">${w.icon} ${s.i+1} of ${s.tasks.length} · ★ ${s.earned}</span>${btn('Pause','openWorlds()')}</div><div class="bar"><span style="width:${s.tasks.filter(t=>t.done).length/s.tasks.length*100}%"></span></div><article class="task ${q.done?'pop':''}">${body}<div class="feedback" role="status" aria-live="polite">${esc(q.message||'')}</div>${q.done?btn(s.i===5?'Collect my stamp':'Next task','questNext()','gold'):''}</article><p class="small">No timer, Leo. Your help is always here. ${esc(voiceNotice)}</p></section>`;stats()}
function questSave(){save();questRender()}
function questChoose(k){let q=questCurrent();if(q.done)return;if(k===0)questComplete();else{q.wrong=true;q.message='Have another look, Leo. Which clue helps?';questSave()}}
function questRead(){let q=questCurrent();if(!q.done)q.readHelp=true;save();questRender();say(q.kind==='story'?STORIES[S.quest.mission].text:q.kind==='build'?q.s.replace('___',q.w):DATA.find(d=>d.w===q.w).s)}
function questWord(){say(questCurrent().w)}
function questAdult(){let q=questCurrent();if(q.done)return;q.help=true;q.message='Grown-up: read the word and sentence without showing the spelling.';questSave()}
function questHint(){let q=questCurrent();if(q.done)return;q.help=true;q.hintOpen=true;q.answer='';questSave()}
function questHide(){let q=questCurrent();if(q.done)return;q.study=false;q.hintOpen=false;q.answer='';questSave()}
function questLetter(c){let q=questCurrent();if(q.done||q.study||q.hintOpen)return;if(q.answer.length<24)q.answer+=c;q.message='';questSave()}
function questErase(){let q=questCurrent();if(q.done)return;q.answer=q.answer.slice(0,-1);questSave()}
function questCheck(){let q=questCurrent();if(q.done||q.study||q.hintOpen||!q.answer)return;if(q.answer===q.w)questComplete();else{q.wrong=true;q.message='Good thinking, Leo. Try again, or use Help me.';questSave()}}
function questComplete(){let q=questCurrent();if(q.done)return;q.done=true;let s=S.quest,id=s.id+':'+s.i,e=expansionState();q.message='You did it, Leo! ★ +1 star';if(!S.awards[id]){S.awards[id]=1;S.stars++;s.earned++;let key=s.world+'-'+s.mission;let r=e.records[key]??={attempts:0,independent:0,supported:0};r.attempts++;if(q.kind!=='build'&&!q.help&&!q.wrong&&!q.readHelp)r.independent++;else r.supported++;if(q.kind==='climb'){rec(q.w).level=Math.max(1,rec(q.w).level);if(q.level===2&&!q.help&&!q.wrong)rec(q.w).level=Math.max(2,rec(q.w).level);evidence({...q,kind:'spell'},Date.now());}}questSave()}
function questBack(){stop();if(S.quest.i>0){S.quest.i--;viewTop();questSave()}else worldPage(S.quest.world)}
function questNext(){if(!questCurrent().done)return;stop();S.quest.i++;save();viewTop();questRender()}
function questFinish(){stop();viewTop();page='questFinish';let s=S.quest,e=expansionState(),key=s.world+'-'+s.mission;if(!s.tasks.every(t=>t.done)){s.i=s.tasks.findIndex(t=>!t.done);questResume();return}let w=WORLDS.find(w=>w.id===s.world);if(!e.cleared[key])e.cleared[key]={at:Date.now()};save();$('app').innerHTML=`<section class="game task"><span class="eyebrow">A new page in Leo’s adventure</span><div class="icon">${w.reward} ⭐ ${w.icon}</div><h1>Stamp collected, Leo!</h1><p><b>${w.missions[s.mission]}</b> is complete.<br>You earned ${s.earned} stars. Trying with help counts too.</p><div class="stamp pop">${w.reward}<br><b>${chapterClears(w.id)} / 6</b></div><p>${chapterClears(w.id)===6?'Your next chapter award is ready in your treasures!':chapterClears(w.id)===3?'Your first world award is yours! Keep growing garden keys for the next chapter.':'Another stamp for Leo! Visit the map to see your next target, or stop here for today.'}</p>${btn('Back to this world','questEnd()','primary')}${btn('Visit my treasures','questTreasures()','gold')}${btn('Look back','questLookBack()')}</section>`}

function questEnd(){let world=S.quest.world;S.quest=null;save();worldPage(world)}

importProgress=async function(file){
 if(!file)return;
 try{
  const x=JSON.parse(await file.text()),object=v=>v&&typeof v==='object'&&!Array.isArray(v),count=v=>Number.isInteger(v)&&v>=0&&v<=10000000;
  if(x.version!==5||!count(x.stars)||!object(x.words)||!object(x.awards))throw Error();
  for(const r of Object.values(x.words))if(!object(r)||!Number.isInteger(r.level)||r.level<0||r.level>3||!Array.isArray(r.clean)||!r.clean.every(Number.isFinite)||!Array.isArray(r.events)||!count(r.meaning)||!count(r.read)||!Number.isFinite(r.last)||!Number.isFinite(r.due))throw Error();
  for(const v of Object.values(x.awards))if(v!==1)throw Error();
  let e={cleared:{},records:{},outfit:'lion',mode:'gentle'},old=x.expeditions;
  if(old!==undefined){if(!object(old)||!object(old.cleared)||!object(old.records))throw Error();
   for(const w of WORLDS)for(let n=0;n<w.missions.length;n++){let key=w.id+'-'+n;if(old.cleared[key]){if(!Number.isFinite(old.cleared[key].at))throw Error();e.cleared[key]={at:old.cleared[key].at}}let r=old.records[key];if(r){if(!count(r.attempts)||!count(r.independent)||!count(r.supported))throw Error();e.records[key]={attempts:r.attempts,independent:r.independent,supported:r.supported}}}
   e.outfit=OUTFITS.some(o=>o.id===old.outfit)?old.outfit:'lion';e.mode=old.mode==='brave'?'brave':'gentle';
  }
  e.foundation=readFoundationBackup(old);x.expeditions=e;x.session=null;x.quest=null;x.settings={rate:[.6,.75,.9].includes(+x.settings?.rate)?+x.settings.rate:.75,voice:typeof x.settings?.voice==='string'?x.settings.voice:''};
  S=x;save();parents();$('importStatus').textContent='Backup restored. Stars, word progress and stamps are safe. Unfinished rounds were cleared.';
 }catch{$('importStatus').textContent='Invalid backup. Your progress is unchanged.'}
};

 ['benches','bench','es','Two ___ stand beside the path.','bench + es. Say bench · es.'],
 ['grander','grand','er','This hall is ___ than the small room.','grand + er compares two things.'],
 ['grandest','grand','est','This is the ___ hall in the castle.','grand + est means grander than all the others.']],
 [
 ['unkind','kind','un','Taking every toy and not sharing is ___.','un + kind means not kind.'],
 ['unsafe','safe','un','The broken bridge is ___ to cross.','un + safe means not safe.'],
 ['unfair','fair','un','Giving one child every turn is ___.','un + fair means not fair.'],
 ['untie','tie','un','Leo must ___ the knot to open the bag.','un + tie reverses tying.'],
 ['sunset','sun','set','The sky turns pink at ___.','Join sun and set to make one word.'],
 ['farmyard','farm','yard','The hens walk around the ___.','Join farm and yard to make one word.']]
);
CLIMBS.push(['afraid','coach','shore','beard','pear','scared'],['around','threw','cried','chief','author','alphabet'],['kitchen','carrot','point','storm','light','green']);
OUTFITS.push({id:'compass',icon:'🧭',name:'Story compass',world:'story',required:6},{id:'toolbox',icon:'🧰',name:'Inventor toolbox',world:'workshop',required:6},{id:'lantern',icon:'🏮',name:'Trail lantern',world:'sounds',required:6});

const FOUNDATION_COST=3; // Three of each activity: nine little steps per new level.
function foundationState(s=S){let e=expansionState(s);return e.foundation??={learn:0,read:0,spell:0,total:0,opened:{}}}
function foundationReady(){let f=foundationState();return Math.min(...['learn','read','spell'].map(k=>Math.floor(f[k]/FOUNDATION_COST)))}
function foundationLeft(){let f=foundationState();return ['learn','read','spell'].reduce((n,k)=>n+Math.max(0,FOUNDATION_COST-f[k]),0)}
function foundationUnlocked(world,n){let e=expansionState();return n<3||!!e.cleared[world+'-'+n]||!!foundationState().opened[world+'-'+n]}
function readFoundationBackup(old){
 let clean={learn:0,read:0,spell:0,total:0,opened:{}};if(!old?.foundation)return clean;let f=old.foundation;
 for(const k of ['learn','read','spell','total'])if(!Number.isInteger(f[k])||f[k]<0||f[k]>10000000)throw Error('Invalid garden steps');else clean[k]=f[k];
 if(!f.opened||typeof f.opened!=='object'||Array.isArray(f.opened))throw Error('Invalid opened levels');
 for(const w of WORLDS)for(let n=3;n<w.missions.length;n++){let key=w.id+'-'+n;if(f.opened[key]){if(!Number.isFinite(f.opened[key].at))throw Error('Invalid opening date');clean.opened[key]={at:f.opened[key].at}}}
 if(clean.total!==clean.learn+clean.read+clean.spell+Object.keys(clean.opened).length*9)throw Error('Invalid practice totals');return clean;
}
function chapterClears(id){return WORLDS.find(w=>w.id===id).missions.filter((_,n)=>expansionState().cleared[id+'-'+n]).length}
function foundationPanel(){let f=foundationState(),left=foundationLeft();return `<section class="foundationPanel" aria-label="Your next adventure target"><div class="row"><div><span class="eyebrow">Little practice, bigger adventures</span><h2>${left?'Grow your next adventure key.':'Your next adventure key is ready! 🔑'}</h2></div><span class="keyCount">🔑 ${foundationReady()}</span></div><p>${left?`${left} more garden steps to your next key, Leo.`:'Choose a new level to open. Your key never expires.'} Every key opens one new level. Open levels stay open.</p><div class="foundationSteps">${[['learn','👀','Look & say'],['read','📖','Read & mean'],['spell','✏️','Spell']].map(([k,icon,name])=>`<div><b>${icon} ${name}</b><div class="bar"><span style="width:${Math.min(3,f[k])/3*100}%"></span></div><span>${Math.min(3,f[k])} / 3</span></div>`).join('')}</div><p>${btn(S.session&&current()?'Continue garden practice':'Do my garden practice','practiceBasics()','primary')}${btn('See my next targets','openWorlds()')}</p><p class="small">3 words · 9 tasks · help is welcome. No timer or daily deadline. Your old adventures are always available.</p></section>`}
function practiceBasics(){if(S.session&&S.session.i>=S.session.tasks.length){S.session=null;save()}if(S.session)resume();else start()}
function openNextLevel(world,n){const w=WORLDS.find(w=>w.id===world),e=expansionState();if(!w||!Number.isInteger(n)||n<3||n>=w.missions.length||!e.cleared[world+'-'+(n-1)])return;if(S.quest){openWorlds();return}if(!foundationUnlocked(world,n)){if(!foundationReady()){worldPage(world);return}let f=foundationState();for(const k of ['learn','read','spell'])f[k]-=FOUNDATION_COST;f.opened[world+'-'+n]={at:Date.now()};save()}startQuest(world,n)}

const foundationComplete=complete;
complete=function(){let q=current();if(q&&!q.done&&['learn','read','spell'].includes(q.kind)&&!S.awards[S.session.id+':'+S.session.i]){let f=foundationState();f[q.kind]++;f.total++}foundationComplete()};
const foundationRender=render;
render=function(){foundationRender();if(page==='game'&&current())$('app').innerHTML+=foundationPanel()};
const foundationFinish=finish;
finish=function(){foundationFinish();$('app').innerHTML+=foundationPanel()};
const nextHome=home;
home=function(){nextHome();let html=$('app').innerHTML;html=html.replace('Three new worlds. Nine levels. New treasures to discover.','Nine more levels are waiting. Grow a key in your garden, then choose a new adventure.');$('app').innerHTML=html.replace('<section class="newAdventure">',foundationPanel()+'<section class="newAdventure">')};

openWorlds=function(){stop();viewTop();page='worlds';$('app').innerHTML=`<section class="game">${btn('Back','home()')}<span class="eyebrow">Leo’s next targets</span><h1>Keep growing. Keep exploring.</h1><p>All your old levels are here. Nine new adventures are waiting beyond them.</p>${foundationPanel()}${S.quest?`<div class="notice">Your paused journey is safe. ${btn('Continue my journey','questResume()','primary')}${btn('Save it for later','parkQuest()')}</div>`:''}<div class="worlds">${WORLDS.map(w=>`<article class="card" style="background:${w.colour}"><span class="icon">${w.icon}</span><h2>${w.name}</h2><p>${w.desc}</p><span class="chip">${chapterClears(w.id)} / 6 stamps</span><p class="small">New targets: ${w.missions.slice(3).join(' · ')}</p>${btn('Visit '+w.name,`worldPage('${w.id}')`,'primary')}</article>`).join('')}</div><p class="small">The first three levels in each world keep their original rules. New levels use one garden key each. Stamps celebrate finishing, including with help.</p></section>`};
worldPage=function(id){stop();viewTop();page='world';let w=WORLDS.find(w=>w.id===id);if(!w)return;let e=expansionState();$('app').innerHTML=`<section class="game">${btn('Back to the map','openWorlds()')}<div class="worldBanner" style="background:${w.colour}"><span class="icon">${w.icon}</span><h1>${w.name}</h1><p>${w.desc}</p><b>${chapterClears(id)} / 6 stamps · Three new levels to aim for.</b></div>${foundationPanel()}${S.quest?`<div class="notice">Continue your paused journey, or save it before choosing another. ${btn('Continue my journey','questResume()')}${btn('Save it for later','parkQuest()')}</div>`:''}${id==='sounds'?`<div class="card"><b>Choose your climb</b><p>${btn((e.mode==='gentle'?'✓ ':'')+'Gentle climb',"setClimb('gentle')",e.mode==='gentle'?'gold':'')}${btn((e.mode==='brave'?'✓ ':'')+'Brave climb',"setClimb('brave')",e.mode==='brave'?'gold':'')}</p><p class="small">Gentle: look, hide, then spell. Brave: start with the full keyboard. Help is always available.</p></div>`:''}<div class="missions">${w.missions.map((name,n)=>{let key=id+'-'+n,cleared=e.cleared[key],previous=n===0||!!e.cleared[id+'-'+(n-1)],opened=foundationUnlocked(id,n),ready=foundationReady();let action=cleared?btn('Practise again',`startQuest('${id}',${n})`,'primary'):!previous?'<span class="small">🔒 Finish the previous level first.</span>':opened?btn('Begin level',`startQuest('${id}',${n})`,'primary'):ready?btn('🔑 Open this level',`openNextLevel('${id}',${n})`,'gold'):btn('Grow my key','practiceBasics()','primary');return `<article class="card row ${n>=3?'newTarget':''}"><div><span class="eyebrow">${n>=3?'New target · ':''}Level ${n+1}</span><h2>${cleared?'✅ ':n>=3&&!opened?'🔒 ':''}${name}</h2><p class="small">${cleared?'Stamp collected. This level stays open.':n>=3&&!opened?`${ready?'A key is ready':foundationLeft()+' more garden steps for a key'} · 6 tasks inside`:'Six little tasks · help is always welcome'}</p>${n>=3?`<p class="small">${id==='story'?'Follow clues, explain why and read a little further.':id==='workshop'?'Build useful word families and join little words together.':'Explore six fresh words with useful sound patterns.'}</p>`:''}</div>${action}</article>`}).join('')}</div></section>`};

const nextOutfitOK=outfitOK;
outfitOK=function(o){return o.required?chapterClears(o.world)>=o.required:nextOutfitOK(o)};
const nextRewards=rewards;
rewards=function(){nextRewards();$('app').innerHTML+=`<section class="game"><h2>Leo’s next chapter awards</h2><p>Your first world awards remain yours. Finish six levels in a world for its new award and accessory.</p><div class="worlds">${[['story','🧭','Clue Captain'],['workshop','🧰','Word Engineer'],['sounds','🏮','Lantern Pathfinder']].map(([id,icon,name])=>`<article class="card"><span class="badge ${chapterClears(id)===6?'unlocked':''}">${icon}</span><h2>${name}</h2><p>${chapterClears(id)} / 6 levels finished</p>${btn('See my targets',`worldPage('${id}')`)}</article>`).join('')}</div></section>`};
const nextParents=parents;
parents=function(){nextParents();let f=foundationState();$('app').innerHTML+=`<section class="game card"><h2>Foundation practice opens new adventures</h2><p>Each new level (4–6) costs one key: three Look & say tasks, three Read & mean tasks and three Spell tasks from the original garden. Help still counts towards the practice target, but never creates independent mastery. Progress starts counting with this update; old stars are not spent or converted into keys.</p><p>Freshly completed tasks count once. Previous, refresh and re-submitting an already finished task add nothing. Extra practice carries forward. Keys have no expiry. Previously finished or opened levels stay open permanently. The first three levels keep their original progression.</p><p><b>${f.total}</b> garden tasks completed towards new adventures · <b>${foundationReady()}</b> keys ready · <b>${Object.keys(f.opened).length}</b> new levels opened.</p></section>`};
foundationState();

save();home();
</script></body></html>
