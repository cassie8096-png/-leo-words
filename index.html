const KEY='leoGardenV5',DAY=86400000,$=id=>document.getElementById(id);let page='home',recognition=null,voiceNotice='';
function fresh(){return{version:5,stars:0,words:{},awards:{},session:null,settings:{rate:.75,voice:''}}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s?.version===5&&s.words&&s.awards)return s;let n=fresh(),old=JSON.parse(localStorage.getItem('leoWordGameV4'));if(old){n.stars=Math.max(0,Number(old.stars)||0);n.legacy=old}return n}catch{return fresh()}}
let S=load();S.settings??={rate:.75,voice:''};function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{$('notice').innerHTML='<p class="notice">This browser cannot save progress. Ask a grown-up to allow website storage, or download a backup.</p>'}stats()}
function stats(){$('stars').textContent='★ '+S.stars+' stars'}function rec(w){return S.words[w]??=( {level:0,clean:[],meaning:0,read:0,due:0,last:0,events:[]})}function stage(r){return['Learning','Supported','Independent','Strong'][r.level]}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,f,c=''){return `<button class="${c}" onclick="${f}">${t}</button>`}
function stop(){if(recognition){recognition.abort();recognition=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voices(){return 'speechSynthesis'in window?speechSynthesis.getVoices():[]}
function say(text){if(!('speechSynthesis'in window)){voiceNotice='Sound is unavailable. A grown-up can read aloud.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=+S.settings.rate||.75;u.voice=voices().find(v=>v.name===S.settings.voice)||voices().find(v=>v.lang==='en-GB')||null;u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled")return;voiceNotice='Sound could not play. Ask a grown-up to read aloud.'};speechSynthesis.speak(u)}
function home(){stop();page='home';let due=DATA.filter(d=>rec(d.w).last&&rec(d.w).due<=Date.now()).length;$('app').innerHTML=`<section class="hero"><div><span class="eyebrow">A little adventure, just for you</span><h1>Let's grow<br>some words, Leo.</h1><p>Listen, discover and spell.<br>Three words. Nine little steps. Lots to be proud of.</p>${btn(S.session?'Continue my adventure →':'Start my adventure →',S.session?'resume()':'start()','primary')}<p class="small">About 5–8 minutes · Stop whenever you like<br>${due?due+' words ready for a gentle revisit.':'A little practice is enough for today.'}</p></div><div class="garden"><div>☀️</div><div class="lion">🦁</div><b>Leo's growing garden</b><div class="flowers">✿ 🌱 🌼 ✿</div></div></section><section class="cards"><article class="card"><span class="icon">🌿</span><h2>My adventure</h2><p>Words chosen for you, with just the help you need.</p>${btn('Let’s go →',S.session?'resume()':'start()','primary')}</article><article class="card"><span class="icon">🔎</span><h2>Explore a patch</h2><p>Sounds, tricky words and useful word endings.</p>${btn('Choose a patch','explore()')}</article><article class="card"><span class="icon">🏅</span><h2>My treasures</h2><p>Every little effort helps your garden grow.</p>${btn('See my rewards','rewards()')}</article></section>`;stats()}
function explore(){stop();page='explore';$('app').innerHTML=`<section class="game">${btn('← Back','home()')}<h1>Pick a patch.</h1><div class="cards">${[...new Set(DATA.map(d=>d.g))].map(g=>`<article class="card"><h2>🌱 ${g}</h2><p>${DATA.filter(d=>d.g===g).length} words to discover</p>${btn('Explore →',`start('${g}')`,'primary')}</article>`).join('')}</div>${S.session?'<p class="small">Your paused adventure will continue first.</p>':''}</section>`}
function selectWords(g){let now=Date.now();return DATA.filter(d=>!g||d.g===g).map((d,i)=>({d,i,r:rec(d.w)})).sort((a,b)=>{let score=x=>x.r.last?(x.r.due<=now?0:2):1;return score(a)-score(b)||(a.r.due||0)-(b.r.due||0)||a.i-b.i}).slice(0,3).map(x=>x.d)}
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(g){if(S.session){resume();return}let tasks=[];selectWords(g).forEach(d=>{let level=rec(d.w).level;(level>=2?['spell','read','learn']:['learn','read','spell']).forEach(kind=>tasks.push({w:d.w,kind,level,answer:'',done:false,help:false,wrong:false,taps:0,said:false,heard:false,order:shuffled([0,1,2])}))});S.session={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),i:0,tasks,earned:0};save();resume()}
function resume(){page='game';render()}function current(){return S.session?.tasks[S.session.i]}
function render(){if(page!=='game')return;let q=current();if(!q){finish();return}let d=DATA.find(d=>d.w===q.w),ss=S.session,body='';
if(q.kind==='learn')body=`<span class="eyebrow">Look · listen · say</span><h2>Meet a word, Leo.</h2><div class="word">${d.w}</div><p>${d.m}.</p><p>${d.h}</p>${btn(q.heard?'✓ Listen again':'🔊 Listen','hearLearn()')}${btn(q.said?'✓ I said it':'🗣 I said it aloud','saidIt()')}${btn('A grown-up read it','adultLearn()')}<p class="small">Tap each letter in order. Say the word as you go.</p><div>${[...d.w].map((c,i)=>btn(i<q.taps?'✓':c,`tapLetter(${i})`,i<q.taps?'gold':'')).join(' ')}</div><p>${btn('🌟 Grow this word','completeLearn()','primary')}</p>${(window.SpeechRecognition||window.webkitSpeechRecognition)?btn('Try my microphone (optional)','mic()'):''}<p class="small">No microphone needed. Say it to a grown-up or your lion.<br>Machines may mishear. Speech is never marked wrong.</p>`;
else if(q.kind==='read')body=`<span class="eyebrow">Read · understand</span><h2>What does it mean?</h2><div class="sentence">${d.s}</div>${btn('🔊 Read with me','readAloud()')}<p>Here, what does <b>${d.w}</b> mean?</p><div class="choices">${q.order.map(k=>btn(d.opts[k],`choose(${k})`,'choice')).join('')}</div><p class="small">${q.readHelp?'Reading together is supported practice.':'Read the sentence yourself, or choose to read together.'}</p>`;
else{let keys=q.level===0?[...new Set(d.w.toLowerCase())].sort().join(''):q.level===1?[...new Set(d.w.toLowerCase()+'aertsin')].sort().join(''):'qwertyuiop|asdfghjkl|zxcvbnm';body=`<span class="eyebrow">${q.level===0?'Build with letters':q.level===1?'Spell with extra letters':'Spell on your own'}</span><h2>Finish the sentence.</h2><div class="sentence">${esc(d.s).replace(new RegExp('\\b'+d.w+'\\b','i'),`<span class="entry" role="status" aria-label="Your spelling">${esc(q.answer)||'____'}</span>`)}</div>${btn('🔊 Whole sentence','hearSentence()')}${btn('🔊 Target word','hearWord()')}<p class="small">${q.level<2?'Letter tiles can be used more than once.':'Your letter keyboard. No word suggestions.'}</p>${q.hintOpen?`<div class="hint"><b>Look & learn</b><div class="word">${d.w}</div><p>${d.h}</p>${btn('🔊 Listen','hearWord()')}${btn('I’m ready — hide it','hideHint()','primary')}</div>`:`<div aria-label="Leo’s letter keyboard">${keys.split('|').map(row=>`<div class="keys">${[...row].map(c=>btn(c,`letter('${c}')`)).join('')}</div>`).join('')}</div><p>${btn('⌫ Delete','erase()')}${btn('Check my word ✓','check()','primary')}</p>${btn('💡 Help me','help()')}${btn('A grown-up will read it','adultRead()')}`}`}
$('app').innerHTML=`<section class="game"><div class="row">${btn('← '+(ss.i?'Previous':'Home'),'back()')}<span class="small">${ss.i+1} of 9 · ★ ${ss.earned} this adventure</span>${btn('Pause ⌂','home()')}</div><div class="bar"><span style="width:${ss.tasks.filter(t=>t.done).length/9*100}%"></span></div><article class="task ${q.done?'pop':''}">${body}<div class="feedback" aria-live="polite" role="status">${esc(q.message||'')}</div>${q.done?btn(ss.i===8?'See my garden →':'Next little step →','next()','gold'):btn('Take a break','home()')}</article><p class="small">${esc(voiceNotice)} ${!('speechSynthesis'in window)?'A grown-up can read each word and sentence aloud.':''}</p></section>`;stats()}
function refresh(){save();render()}function hearLearn(){current().heard=true;save();render();say(current().w)}function adultLearn(){current().heard=true;refresh()}function saidIt(){current().said=true;refresh()}function tapLetter(i){let q=current();if(!q.done&&i===q.taps)q.taps++;refresh()}function completeLearn(){let q=current();if(q.done)return;if(!q.heard||!q.said||q.taps<q.w.length){q.message='Listen, say it, then tap all the letters in order.';refresh();return}complete()}
function mic(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;stop();let q=current(),r=new R();recognition=r;r.lang='en-GB';r.interimResults=false;q.message='Listening… You can always use “I said it aloud”.';render();r.onresult=e=>{q.said=true;q.message='Thank you for saying it, Leo! Now tap the letters.';save();render()};r.onerror=()=>{q.message='The microphone could not hear. No problem! Say it aloud and tap “I said it aloud”.';save();render()};r.onend=()=>{recognition=null;if(!q.said&&q.message.startsWith("Listening")){q.message="No problem, Leo. Say it aloud, then tap the say button.";save();render()}};try{r.start()}catch{q.message='Use “I said it aloud” instead.';refresh()}}
function readAloud(){let q=current();if(!q.done)q.readHelp=true;save();render();say(DATA.find(d=>d.w===q.w).s)}function choose(k){let q=current();if(q.done)return;if(k===0)complete();else{q.wrong=true;q.message='Let’s think about the sentence. Have another go, Leo.';refresh()}}
function letter(c){let q=current();if(q.done||q.hintOpen)return;if(q.answer.length<24)q.answer+=c;q.message='';refresh()}function erase(){let q=current();if(!q.done)q.answer=q.answer.slice(0,-1);refresh()}function hearSentence(){say(DATA.find(d=>d.w===current().w).s)}function hearWord(){say(current().w)}function adultRead(){let q=current();if(q.done)return;q.help=true;q.message='Grown-up: read the sentence and target word aloud without showing the spelling.';refresh()}function help(){let q=current();if(q.done)return;q.help=true;q.hintOpen=true;q.answer='';refresh()}function hideHint(){current().hintOpen=false;current().answer='';refresh()}function check(){let q=current();if(q.done||q.hintOpen||!q.answer)return;if(q.answer===q.w.toLowerCase())complete();else{q.wrong=true;q.message='Good thinking, Leo. Listen again, or try “Help me”.';refresh()}}
function evidence(q,now=Date.now()){let r=rec(q.w),independent=q.kind==='spell'&&q.level>=2&&!q.help&&!q.wrong;r.events.push({at:now,kind:q.kind,independent,help:!!q.help,wrong:!!q.wrong,readHelp:!!q.readHelp,level:q.level});r.events=r.events.slice(-60);if(q.kind==='learn'&&r.level===0)r.level=1;if(q.kind==='read'&&!q.wrong&&!q.readHelp){r.meaning++;r.read++}if(q.kind==='spell'){if(q.level===1&&!q.help&&!q.wrong)r.level=Math.max(2,r.level);if(independent){let last=r.clean.at(-1);if(!last||now-last>=DAY)r.clean.push(now);if(r.clean.length>=3&&now-r.clean[0]>=7*DAY&&r.meaning>0&&r.read>0)r.level=3;r.due=now+[DAY,3*DAY,7*DAY,14*DAY][Math.min(3,r.clean.length-1)]}else{r.due=now+DAY;if(q.wrong||q.help){r.clean=[];if(r.level===3)r.level=2}}}r.last=now;if(!r.due)r.due=now+DAY}
function complete(){let q=current();if(q.done)return;let id=S.session.id+':'+S.session.i;q.done=true;q.message='You grew a little, Leo! ★ +1 star';if(!S.awards[id]){S.awards[id]=1;S.stars++;S.session.earned++;evidence(q)}refresh()}function back(){stop();if(S.session.i>0){S.session.i--;refresh()}else home()}function next(){stop();if(!current().done)return;S.session.i++;save();render()}
function finish(){stop();page='finish';$('app').innerHTML=`<section class="game task"><div class="icon">🌻 🦁 🌻</div><h1>You grew your garden, Leo!</h1><p>Nine little steps. You earned <b>${S.session.earned} stars</b>.<br>Learning together counts. Trying again counts.</p><div class="word">★ ${S.stars}</div>${btn('Visit my treasures','endRewards()','gold')}${btn('All done for now','endHome()','primary')}${btn('← Look back','lookBack()')}<p class="small">Your stars are saved. Come back whenever you feel ready.</p></section>`}function lookBack(){S.session.i=8;save();resume()}function endHome(){S.session=null;save();home()}function endRewards(){S.session=null;save();rewards()}
function rewards(){stop();page='rewards';let badges=[[9,'🌱','Seed starter'],[25,'🌼','Garden helper'],[50,'🦋','Butterfly friend'],[100,'🌳','Word explorer'],[200,'🏰','Garden guardian']],n=badges.find(b=>b[0]>S.stars);$('app').innerHTML=`<section class="game">${btn('← Back','home()')}<h1>Leo's treasures.</h1><p>Stars celebrate your effort. Your words grow at their own pace.</p><article class="task"><div class="garden"><div class="lion">🦁</div><b>${S.stars>=25?'Your flowers are blooming!':'Every star helps your garden grow.'}</b><div class="flowers">✿ 🌱 🌼 ✿</div></div>${badges.map(([v,e,t])=>`<div class="chip"><div class="badge ${S.stars>=v?'unlocked':''}">${e}</div><b>${t}</b><br><span class="small">${S.stars>=v?'Unlocked!':v+' stars'}</span></div>`).join('')}<p>${n?n[0]-S.stars+' more stars to '+n[2]+'.':'All garden treasures unlocked, Leo!'}</p></article></section>`}
function parents(){stop();page='parents';let counts=[0,0,0,0];DATA.forEach(d=>counts[rec(d.w).level]++);$('app').innerHTML=`<section class="game">${btn('← Back','home()')}<h1>Growing, at Leo's pace.</h1><p>${DATA.length} original activities based on England Year 1 spelling. RWI Red Words are a supplementary cross-check, not a Year 2 list.</p>${counts.map((n,i)=>`<span class="chip">${stage({level:i})}: <b>${n}</b></span>`).join('')}<article class="card"><h2>What the stages mean</h2><p>Learning: explore and say a word. Supported: spell with letter choices. Independent: full keyboard after clean supported spelling. Strong: three clean independent successes at least 24 hours apart, spanning seven days, plus unaided sentence-meaning evidence.</p><p>Stars reward each activity once. Help, a submitted mistake or reading together cannot create independent evidence. A Strong word needing spelling help returns to Independent and its retention evidence restarts. Reviews return after 1, 3, 7 and up to 14 days. Same-day repetition does not add retention days.</p><p class="small">A practice indicator, not a diagnosis. Speaking is participation, not a pronunciation score. No streak penalties. New words are prioritised after due reviews. This starter bank samples Year 1 patterns; it is not a complete school phonics programme.</p><h2>Sound & privacy</h2><label>Speech speed <select onchange="S.settings.rate=+this.value;save()">${[.6,.75,.9].map(n=>`<option value="${n}" ${+S.settings.rate===n?'selected':''}>${n===.6?'Extra gentle':n===.75?'Gentle':'Natural'}</option>`).join('')}</select></label><p><label>Voice <select onchange="S.settings.voice=this.value;save()"><option value="">Automatic UK voice</option>${voices().filter(v=>/^en/i.test(v.lang)).map(v=>`<option value="${esc(v.name)}" ${S.settings.voice===v.name?'selected':''}>${esc(v.name+' ('+v.lang+')')}</option>`).join('')}</select></label></p>${btn('Test sound','say("Hello Leo. The rain is on the boat.")')}<p class="small">Device speech, preferably en-GB. Cambridge UK pronunciation is a reference, with no copied audio. Check the actual iPad voice. If sound fails, a grown-up can read aloud. Optional speech recognition may use the browser vendor’s service; the game stores no recordings.</p><p class="small">Progress stays in this browser on this device. No account or cloud sync. Export before clearing website data. Old v4 stars are preserved; old mastery counts are retained only as history.</p>${btn('Download backup','exportProgress()')}${btn('Restore backup','document.getElementById("import").click()')}<input id="import" type="file" accept="application/json" hidden onchange="importProgress(this.files[0])"><p id="importStatus" class="small" role="status"></p></article><h2>Word evidence</h2><div class="scroll"><table><thead><tr><th>Word / patch</th><th>Stage</th><th>Retention days</th><th>Review</th></tr></thead><tbody>${DATA.map(d=>{let r=rec(d.w);return `<tr><td><b>${d.w}</b><br>${d.g}</td><td>${stage(r)}</td><td>${r.clean.length}</td><td>${!r.last?'New':r.due<=Date.now()?'Ready':new Date(r.due).toLocaleDateString('en-GB')}</td></tr>`}).join('')}</tbody></table></div><h2>Teaching references</h2><p class="small"><a href="https://assets.publishing.service.gov.uk/media/5a7ccc06ed915d63cc65ce61/English_Appendix_1_-_Spelling.pdf">DfE Year 1 spelling appendix</a> · <a href="https://www.spellingshed.com/en-gb/mastery-zone">Spelling Shed</a> · <a href="https://www.teachyourmonster.org/teach-your-monster-to-read-overview/">Teach Your Monster</a> · <a href="https://nessy.com/en-us/about-us/the-nessy-approach-to-learning/">Nessy</a> · <a href="https://kb.readingeggs.com/en_GB/5-spelling">Reading Eggs</a> · <a href="https://dictionary.cambridge.org/pronunciation/english/said">Cambridge UK: said</a> · <a href="https://dictionary.cambridge.org/pronunciation/english/school">Cambridge UK: school</a></p><p class="small">Original interface, explanations and sentences. No vendor artwork, worksheets or audio copied. Day names and I accept lower-case letter spelling; capital letters are taught in learning notes, not assessed.</p></section>`}
function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='leo-word-garden-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importProgress(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==5||!Number.isFinite(x.stars)||x.stars<0||!x.words||!x.awards)throw Error();for(let r of Object.values(x.words))if(!Number.isInteger(r.level)||r.level<0||r.level>3||!Array.isArray(r.clean)||!r.clean.every(Number.isFinite)||!Array.isArray(r.events))throw Error();x.session=null;x.settings??={rate:.75,voice:''};S=x;save();parents();$('importStatus').textContent='Backup restored. Unfinished adventure cleared.'}catch{$('importStatus').textContent='Invalid backup. Your progress is unchanged.'}}
save();home();
</script></body></html>
